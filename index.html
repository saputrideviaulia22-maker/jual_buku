<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jual Buku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .produk {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .produk h2 {
            margin-top: 0;
        }

        .harga {
            color: green;
            font-weight: bold;
        }

        button {
            background: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Jual Buku</h1>
        <p>Toko Buku Online</p>
    </header>

    <div class="container">

        <div class="produk">
            <h2>Buku Pemrograman Web</h2>
            <p>Belajar HTML, CSS, dan JavaScript untuk pemula.</p>
            <p class="harga">Rp50.000</p>
            <button>Beli Sekarang</button>
        </div>

        <div class="produk">
            <h2>Buku Pemrograman PHP</h2>
            <p>Panduan belajar PHP dari dasar.</p>
            <p class="harga">Rp60.000</p>
            <button>Beli Sekarang</button>
        </div>

    </div>

</body>
</html>
